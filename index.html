<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя страница — крестики-нолики</title>
  <meta name="description" content="Личная страница с мини-игрой крестики-нолики.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="photo-wrap">
        <img class="photo" src="assets/avatar.jpg" alt="Фото">
      </div>
      <p class="quote">“Красота в глазах смотрящего”</p>

      <div class="player" id="player">
        <audio id="audio" src="assets/music.mp3" loop preload="metadata"></audio>

        <div class="player-top">
          <button class="play" id="play" type="button" aria-label="Включить музыку">▶</button>
          <div class="track">
            <span class="track-title">Where you are</span>
            <span class="track-artist">Halal Beats · Slowed</span>
          </div>
          <div class="player-actions">
            <button class="pbtn" id="restart" type="button" aria-label="С начала" title="С начала">⏮</button>
            <button class="pbtn" id="forward" type="button" aria-label="Вперёд 10 секунд" title="Вперёд 10 секунд">⏩</button>
            <button class="pbtn on" id="repeat" type="button" aria-label="Повтор" title="Повтор">🔁</button>
            <button class="pbtn" id="mute" type="button" aria-label="Звук" title="Звук">🔊</button>
          </div>
        </div>

        <div class="progress-row">
          <span class="time" id="current">0:00</span>
          <input class="seek" id="seek" type="range" min="0" max="1000" value="0" style="--fill:0%" aria-label="Перемотка">
          <span class="time" id="duration">0:00</span>
        </div>

        <div class="volume-row">
          <span class="vol-label">🔈</span>
          <input class="volume" id="volume" type="range" min="0" max="100" value="70" style="--fill:70%" aria-label="Громкость">
          <span class="vol-value" id="vol-value">70%</span>
        </div>
      </div>
    </section>

    <section class="game" id="game">
      <h2 class="game-title">Крестики-нолики</h2>
      <p class="game-sub">Ты играешь за <span class="x-mark">X</span>, компьютер — за <span class="o-mark">O</span></p>

      <div class="board" id="board" role="grid" aria-label="Игровое поле 3 на 3">
        <button class="cell" data-index="0" aria-label="Клетка 1"></button>
        <button class="cell" data-index="1" aria-label="Клетка 2"></button>
        <button class="cell" data-index="2" aria-label="Клетка 3"></button>
        <button class="cell" data-index="3" aria-label="Клетка 4"></button>
        <button class="cell" data-index="4" aria-label="Клетка 5"></button>
        <button class="cell" data-index="5" aria-label="Клетка 6"></button>
        <button class="cell" data-index="6" aria-label="Клетка 7"></button>
        <button class="cell" data-index="7" aria-label="Клетка 8"></button>
        <button class="cell" data-index="8" aria-label="Клетка 9"></button>
      </div>

      <p class="status" id="status">Твой ход</p>

      <div class="score">
        <div class="score-item">
          <span class="score-label">Ты</span>
          <span class="score-value" id="score-player">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">Ничьи</span>
          <span class="score-value" id="score-draw">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">Компьютер</span>
          <span class="score-value" id="score-ai">0</span>
        </div>
      </div>

      <button class="reset" id="reset" type="button">Новая игра</button>
    </section>
  </main>

  <footer class="footer">
    <span>Сделано с ❤️</span>
  </footer>

  <script src="script.js"></script>
  <script src="player.js"></script>
</body>
</html>
